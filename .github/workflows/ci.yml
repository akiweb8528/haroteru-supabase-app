name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database Sync Regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haroteru_test
          POSTGRES_PASSWORD: haroteru_test
          POSTGRES_DB: haroteru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haroteru_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: haroteru_test
      PGPASSWORD: haroteru_test
      PGDATABASE: haroteru_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply migrations against isolated Auth fixture
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth-fixture.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify operation receipts and user isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/subscription_operation_receipts.sql
      - name: Verify concurrent retries create a single row
        run: bash supabase/tests/concurrent-operation-receipts.sh
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node.js version
        run: node -e "console.log(process.version); if (process.versions.node !== '24.22.1') process.exit(1)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
